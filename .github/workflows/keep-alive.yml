name: Keep Supabase Alive

# ⚠️ 間隔を週1にしてはいけない（2026-10-19 に実際に止まった）
#
# Supabase Free は「7日間アクセスなし」で自動停止する。
# 旧設定は週1（月曜のみ）だったが、これは 7日しきい値に対して余裕がゼロ。
# さらに GitHub Actions の schedule は混雑時に数時間ずれる実績があり、
# 実際の実行は 08:25 / 09:11 / 09:51 / 10:02 と毎回 5〜7時間遅れていた。
# この遅れが積み上がって 7日を超え、2026-10-13 にプロジェクトが停止した。
#
# → 毎日1回に変更。7日しきい値に対して 6日ぶんの余裕ができる。
#   1日ぶん実行が飛んでも、数日連続で飛ばない限り止まらない。
#   GitHub Actions の無料枠は月2000分あり、1回10秒 × 31日 = 約5分なので
#   コストは実質ゼロ。

on:
  schedule:
    # 毎日 03:00 UTC（日本時間 12:00）。遅延しても翌日またpingされる
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent Free plan auto-pause
        env:
          SUPABASE_URL: https://wqxoesrqykdwzfwzkavk.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_Wb3qUGozdkrhjtmnx0dYng_MmrAUKJ2
        run: |
          set -e
          echo "Pinging Supabase at $(date -u)"
          RESPONSE=$(curl -sS -w "\nHTTP_STATUS:%{http_code}\n" \
            "$SUPABASE_URL/rest/v1/news?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep HTTP_STATUS | cut -d: -f2)
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo "::error::Supabase ping failed with status $STATUS"
            exit 1
          fi
          echo "OK: Supabase is alive"
