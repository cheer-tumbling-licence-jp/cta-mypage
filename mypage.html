<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マイページ｜チアタンブリング協会</title>
  <link rel="stylesheet" href="css/styles.css?v=20260622b" />
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <div class="brand">
        <div class="logo">CTA</div>
        <div>チアタンブリング協会<small>受講者マイページ</small></div>
      </div>
      <div class="header-actions">
        <span class="who" id="who"></span>
        <button class="btn ghost sm" id="logoutBtn">ログアウト</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title" id="greeting">マイページ</h1>
    <p class="page-sub" id="memberMeta"></p>

    <!-- 新着情報 -->
    <section class="card">
      <h2><span class="ic">📢</span>新着情報</h2>
      <div id="news"><p class="empty">読み込み中…</p></div>
    </section>

    <!-- 合否結果 -->
    <section class="card">
      <h2><span class="ic">📋</span>合否結果</h2>
      <div id="results"><p class="empty">読み込み中…</p></div>
    </section>

    <!-- 認定証 -->
    <section class="card" id="certsCard" style="display:none">
      <h2><span class="ic">🏅</span>合格証・認定証</h2>
      <div id="certs"><p class="empty">読み込み中…</p></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=20260622b"></script>
  <script src="js/data.supabase.js?v=20260622b"></script>
  <script src="js/mypage.js?v=20260622b"></script>
</body>
</html>
