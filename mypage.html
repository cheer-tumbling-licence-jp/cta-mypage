<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マイページ｜チアタンブリング協会</title>
  <link rel="stylesheet" href="css/styles.css?v=20260917a" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CTAマイページ" />
  <meta name="theme-color" content="#143a5a" />
</head>
<body>
  <header class="site-header">
    <div class="bar">
      <div class="brand">
        <div class="logo">CTA</div>
        <div>チアタンブリング協会<small>受講者マイページ</small></div>
      </div>
      <div class="header-actions">
        <span class="who" id="who"></span>
        <button class="btn ghost sm" id="logoutBtn">ログアウト</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <h1 class="page-title" id="greeting">マイページ</h1>
    <p class="page-sub" id="memberMeta"></p>

    <!-- 新着情報 -->
    <section class="card">
      <h2><span class="ic">📢</span>新着情報</h2>
      <div id="news"><p class="empty">読み込み中…</p></div>
    </section>

    <!-- 合否結果 -->
    <section class="card">
      <h2><span class="ic">📋</span>合否結果</h2>
      <div id="results"><p class="empty">読み込み中…</p></div>
    </section>

    <!-- 認定証 -->
    <section class="card" id="certsCard" style="display:none">
      <h2><span class="ic">🏅</span>合格証・認定証</h2>
      <div id="certs"><p class="empty">読み込み中…</p></div>
    </section>

    <!-- 予習教材 -->
    <section class="card" id="prepCard">
      <h2><span class="ic">🎧</span>予習教材</h2>
      <p class="card-lead">講習会の予習用音声・スライドをご視聴いただけます。</p>
      <div id="prepList"><p class="empty">読み込み中…</p></div>
    </section>

    <!-- オンラインサロン -->
    <section class="card salon-card">
      <div class="salon-inner">
        <div class="salon-icon">💫</div>
        <div class="salon-text">
          <h2 style="margin-bottom:6px">オンラインサロン</h2>
          <p class="card-lead" style="margin:0">現場の指導ノウハウ・限定動画・ライブ配信をご覧いただけます。<br>受講後の学びを深めたい方におすすめです。</p>
        </div>
        <a href="https://lounge.dmm.com/detail/8778" target="_blank" rel="noopener" class="btn salon-btn">サロンを見る →</a>
      </div>
    </section>

    <!-- 通知設定 -->
    <section class="card" id="settingsCard">
      <h2><span class="ic">⚙️</span>通知設定</h2>
      <div id="settings">
        <label class="setting-row">
          <div class="setting-text">
            <div class="setting-title">合否発表・お知らせをメールで受け取る</div>
            <div class="setting-sub">合否が反映された時や、新しいお知らせが投稿された時にご登録のメールアドレスにご案内が届きます。</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="notifyEmail" checked>
            <span class="slider"></span>
          </label>
        </label>
        <div id="settingsMsg" class="setting-msg"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=20260917a"></script>
  <script src="js/data.supabase.js?v=20260917a"></script>
  <script src="js/mypage.js?v=20260917a"></script>
  <script src="js/install-prompt.js?v=20260727a"></script>
  <script src="js/badge.js?v=20260917a"></script>
</body>
</html>
